<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML Fetch Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Prism -->
<link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">

<style>
body {
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  padding: 30px;
}

.container {
  max-width: 950px;
  margin: auto;
  background: #fff;
  padding: 25px;
  border-radius: 12px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.selector-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.add-btn {
  padding: 12px 16px;
  background: #667eea;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.fetch-btn {
  margin-top: 15px;
  width: 100%;
  padding: 14px;
  background: #764ba2;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.loading-bar {
  height: 4px;
  width: 0;
  background: linear-gradient(90deg, #667eea, #764ba2);
  margin-top: 10px;
  transition: width 0.4s ease;
}

.result-block {
  background: #1e1e1e;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
}

.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.result-header span {
  color: #9cdcfe;
  font-weight: bold;
}

.copy-btn {
  background: #0d6efd;
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
}

.fix-btn {
  background: #ff9800;
}

.copy-btn.copied {
  background: #28a745;
}

pre {
  margin: 0;
  max-height: 450px;
  overflow: auto;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

  <input id="url" placeholder="Enter Base Website URL (Example: https://www.manageengine.com)">

  <div id="selectors">
    <div class="selector-row">
      <input placeholder=".class or #id">
      <button class="add-btn" onclick="addSelector()">+</button>
    </div>
  </div>

  <button class="fetch-btn" onclick="fetchContent()">Fetch HTML</button>
  <div class="loading-bar" id="loadingBar"></div>

  <div id="results"></div>
</div>

<!-- Prism -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>

<script>
function addSelector() {
  const row = document.createElement('div');
  row.className = 'selector-row';
  row.innerHTML = `
    <input placeholder=".class or #id">
    <button class="add-btn" onclick="this.parentElement.remove()">−</button>
  `;
  document.getElementById('selectors').appendChild(row);
}

function startLoading() {
  document.getElementById('loadingBar').style.width = '100%';
}

function stopLoading() {
  setTimeout(() => {
    document.getElementById('loadingBar').style.width = '0';
  }, 400);
}

async function fetchContent() {
  const url = document.getElementById('url').value.trim();
  const selectors = [...document.querySelectorAll('#selectors input')]
    .map(i => i.value.trim())
    .filter(Boolean);

  if (!url) return;

  startLoading();

  const res = await fetch('/api/fetch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url, selectors })
  });

  const data = await res.json();
  stopLoading();

  renderAll(data);
}

function formatHTML(html) {
  const tab = '  ';
  let formatted = '';
  let indent = 0;

  html.replace(/></g, '>\n<').split('\n').forEach(line => {
    line = line.trim();
    if (line.startsWith('</')) indent = Math.max(indent - 1, 0);
    formatted += tab.repeat(indent) + line + '\n';
    if (
      line.startsWith('<') &&
      !line.startsWith('</') &&
      !line.endsWith('/>') &&
      !line.includes('</')
    ) indent++;
  });

  return formatted.trim();
}

function escapeHTML(str) {
  return str.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
}

function renderBlock(title, code, lang) {
  if (!code) return '';

  const formatted = lang === 'html' ? formatHTML(code) : code;
  const escaped = escapeHTML(formatted);

  return `
    <div class="result-block">
      <div class="result-header">
        <span>${title}</span>
        <div style="display:flex; gap:8px;">
        ${lang === 'html' || lang === 'css' ? 
  `<button class="copy-btn fix-btn" onclick="fixImages(this, '${lang}')">Fix URLs</button>` 
  : ''}
          <button class="copy-btn" onclick="copyCode(this)">Copy</button>
        </div>
      </div>
      <pre><code class="language-${lang}">${escaped}</code></pre>
    </div>
  `;
}

function renderAll(data) {
  const results = document.getElementById('results');
  results.innerHTML = '';

if (data.title) {
  results.innerHTML += `
    <div class="result-block">
      <div class="result-header">
        <span>Page Title</span>
        <button class="copy-btn" onclick="copyCode(this)">Copy</button>
      </div>
      <pre><code class="language-markup">${escapeHTML(data.title)}</code></pre>
    </div>
  `;
}

  if (data.inlineStyles) {
    results.innerHTML += renderBlock('Inline CSS', data.inlineStyles, 'css');
  }

  if (data.inlineScripts) {
    results.innerHTML += renderBlock('Inline JS', data.inlineScripts, 'javascript');
  }

  data.results.forEach(item => {
    results.innerHTML += renderBlock(item.selector, item.content, 'html');
  });

  Prism.highlightAll();
}

function copyCode(btn) {
  const code = btn.closest('.result-block').querySelector('code').innerText;
  navigator.clipboard.writeText(code);

  btn.textContent = 'Copied';
  btn.classList.add('copied');

  setTimeout(() => {
    btn.textContent = 'Copy';
    btn.classList.remove('copied');
  }, 1500);
}

function fixImages(btn, type) {

  const baseUrl = document.getElementById('url').value.trim();

  if (!baseUrl) {
    alert("Enter Base Website URL first (Example: https://www.manageengine.com)");
    return;
  }

  const cleanBase = baseUrl.replace(/\/$/, '');
  const block = btn.closest('.result-block');
  const codeElement = block.querySelector('code');
  const originalContent = codeElement.innerText;

  if (type === "html") {

    const parser = new DOMParser();
    const doc = parser.parseFromString(originalContent, "text/html");


    doc.querySelectorAll("img").forEach(img => {
      const src = img.getAttribute("src");
      if (src && !src.startsWith("http") && !src.startsWith("data:")) {
        img.setAttribute("src", new URL(src, cleanBase).href);
      }
    });


    doc.querySelectorAll("source").forEach(source => {
      const srcset = source.getAttribute("srcset");
      if (srcset && !srcset.startsWith("http")) {
        source.setAttribute("srcset", new URL(srcset, cleanBase).href);
      }
    });

    const updatedHTML = doc.body.innerHTML;
    const formatted = formatHTML(updatedHTML);
    codeElement.innerHTML = escapeHTML(formatted);
  }

 
  if (type === "css") {

    const updatedCSS = originalContent.replace(/url\((.*?)\)/g, (match, p1) => {

      let url = p1.trim().replace(/['"]/g, '');

      if (
        url.startsWith("http") ||
        url.startsWith("data:") ||
        url.startsWith("//")
      ) {
        return `url(${url})`;
      }

      try {
        const absolute = new URL(url, cleanBase).href;
        return `url(${absolute})`;
      } catch {
        return match;
      }
    });

    codeElement.innerHTML = escapeHTML(updatedCSS);
  }

  Prism.highlightElement(codeElement);

  btn.textContent = "URLs Fixed ✅";
  btn.style.background = "#28a745";
}
</script>

</body>
</html>
